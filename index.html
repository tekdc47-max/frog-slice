canvas.addEventListener('pointerenter',pointer);canvas.addEventListener('pointermove',pointer);canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);if(e.pointerType==='touch')touchPointer=e.pointerId;lastPointer=null;pointer(e)});canvas.addEventListener('pointerleave',e=>{pointer(e);lastPointer=null;weapon=null});canvas.addEventListener('pointerup',e=>{pointer(e);if(e.pointerType==='touch'){touchPointer=null;lastPointer=null;weapon=null}});canvas.addEventListener('pointercancel',()=>{touchPointer=null;lastPointer=null;weapon=null});
function drawImage(obj,half=false){ctx.save();ctx.translate(obj.x,obj.y);ctx.rotate(obj.rotation);ctx.globalAlpha=half?Math.min(1,obj.life*1.5):1;const r=obj.r;if(half){ctx.rotate(obj.clipAngle);ctx.beginPath();ctx.rect(-r*3,obj.side<0?-r*3:0,r*6,r*3);ctx.clip();ctx.rotate(-obj.clipAngle)}ctx.drawImage(images[obj.level],-r,-r,r*2,r*2);ctx.restore();if(!half&&obj.level>=7){ctx.save();ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillStyle='#c39b3b';ctx.fillText(`+${(obj.level+1)*10}`,obj.x,obj.y+r+12);ctx.restore()}}
function drawBomb(obj){ctx.save();ctx.translate(obj.x,obj.y);const gradient=ctx.createRadialGradient(-8,-10,1,0,0,obj.r);gradient.addColorStop(0,'#6a6371');gradient.addColorStop(1,'#29232e');ctx.fillStyle=gradient;ctx.beginPath();ctx.arc(0,0,obj.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#978269';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(6,-obj.r+3);ctx.quadraticCurveTo(7,-obj.r-15,18,-obj.r-10);ctx.stroke();ctx.fillStyle='#ffba55';ctx.beginPath();ctx.arc(18,-obj.r-10,4+Math.sin(elapsed*25)*1.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f9ddd6';ctx.font=`bold ${obj.r*.7}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('−100',0,2);ctx.restore()}
function tick(time){const dt=Math.min(.035,(time-lastTime)/1000||0);lastTime=time;ctx.clearRect(0,0,W,H);if(playing&&!paused){elapsed+=dt;remaining=Math.max(0,60-elapsed);$('timer').textContent=`${Math.ceil(remaining)} 秒 · 难度 ${difficulty(elapsed).stage}`;$('timer').style.color=remaining<10?'#e5796c':'';nextWave-=dt;if(nextWave<=0&&objects.length===0&&pieces.length===0){spawnWave();nextWave=difficulty(elapsed).interval+Math.random()*.25}for(const obj of objects){const wait=Math.min(obj.delay,dt);obj.delay-=wait;const motionDt=dt-wait;if(motionDt<=0)continue;obj.x+=obj.vx*motionDt;obj.y+=obj.vy*motionDt+obj.gravity*.5*motionDt*motionDt;obj.vy+=obj.gravity*motionDt;obj.rotation+=obj.spin*motionDt;if(onStage(obj,obj.x,obj.y))obj.entered=true;if(!obj.cut&&obj.entered&&(obj.y>H+obj.r*1.5||obj.x < -obj.r*1.5||obj.x > W+obj.r*1.5)){obj.cut=true;if(!obj.bomb){updateScore(-5);labels.push({x:Math.max(35,Math.min(W-35,obj.x)),y:H-40,text:'漏切 −5',color:'#cc967e',life:1});combo=0;$('combo').textContent=''}}}objects=objects.filter(o=>!o.cut&&o.y<H+150);for(const p of pieces){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.rotation+=p.spin*dt;p.life-=dt}pieces=pieces.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const label of labels){label.y-=35*dt;label.life-=dt}labels=labels.filter(l=>l.life>0);trail=trail.filter(p=>elapsed-p.t<.18);flash=Math.max(0,flash-dt);if(elapsed-lastCut>1)$('combo').textContent='';if(remaining<=0)finish()}
ctx.strokeStyle='#dfc7a244';ctx.lineWidth=1;ctx.setLineDash([5,7]);ctx.beginPath();ctx.moveTo(18,H-23);ctx.lineTo(W-18,H-23);ctx.stroke();ctx.setLineDash([]);for(const obj of objects)if(obj.delay<=0)obj.bomb?drawBomb(obj):drawImage(obj);for(const p of pieces)drawImage(p,true);for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const label of labels){ctx.save();ctx.globalAlpha=Math.min(1,label.life*2);ctx.fillStyle=label.color;ctx.font='bold 23px system-ui';ctx.textAlign='center';ctx.fillText(label.text,label.x,label.y);ctx.restore()}if(trail.length>1){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='#fff';ctx.shadowBlur=12;ctx.strokeStyle='#fff9ec';ctx.lineWidth=4;ctx.beginPath();trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#edb459';ctx.lineWidth=1.1;ctx.stroke();ctx.restore()}drawWeapon();if(flash){ctx.fillStyle=`rgba(255,100,100,${flash*.7})`;ctx.fillRect(0,0,W,H)}requestAnimationFrame(tick)}
function showDialog(title,content){if(playing&&!paused)setPause(true);$('dialogTitle').textContent=title;$('dialogContent').replaceChildren(content);$('dialog').showModal()}
$('help').onclick=()=>{const container=document.createElement('div');const p=document.createElement('p');p.textContent='由低级到高级依次为 10–110 分，等级越高体积越小。漏切每只扣 5 分，切中炸弹扣 100 分，允许负分。一口气连切 2 只起有额外加分。每 15 秒提升一个难度阶段，飞行速度、出场频率和高级奶娃比例逐渐提高。';container.append(p);const grid=document.createElement('div');grid.className='levels';files.forEach((file,i)=>{const cell=document.createElement('div');cell.className='level';const img=document.createElement('img');img.src=embeddedImages[file+".webp"];img.alt=`${i+1}级奶娃`;const b=document.createElement('b');b.textContent=`${i+1} 级 · +${(i+1)*10}`;cell.append(img,b);grid.append(cell)});container.append(grid);showDialog('计分规则',container)};
$('board').onclick=()=>{const container=document.createElement('div');const p=document.createElement('p');p.textContent=records.length?'最近 10 局，仅保存在当前浏览器。':'还没有记录，先切一局吧！';container.append(p);records.forEach(r=>{const line=document.createElement('p');line.textContent=`${r.score} 分 · ${r.date}`;container.append(line)});showDialog('本地记录',container)};
$('close').onclick=()=>$('dialog').close();$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))$('dialog').close()});$('start').onclick=start;$('reset').onclick=start;$('resume').onclick=()=>setPause(false);$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊';$('sound').setAttribute('aria-pressed',String(!muted));$('sound').setAttribute('aria-label',muted?'打开声音':'关闭声音');if(!muted)tone(600)};window.addEventListener('keydown',e=>{if($('dialog').open)return;if(e.key.toLowerCase()==='r')start();if(e.code==='Space'){e.preventDefault();playing?setPause(!paused):$('start').disabled||start()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true)});
Promise.all(images.map(img=>img.decode())).then(()=>{images.forEach((image,i)=>hitBoxes[i]=imageHitBoxes(image));$('start').disabled=false;$('start').textContent='开始切奶蛙';requestAnimationFrame(tick)}).catch(()=>{$('result').textContent='图片加载失败，请刷新页面重试';$('start').textContent='素材加载失败'});
})();
